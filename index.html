<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Voice Note 💌</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff0f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 16px;
    }
    .card {
      background: white;
      padding: 30px 24px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(255, 107, 129, 0.15);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h2 { color: #ff6b81; margin-top: 0; margin-bottom: 6px; font-size: 22px; }
    p { color: #747d8c; font-size: 14px; margin-bottom: 20px; }
    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-record { background: #ff4757; color: white; }
    .btn-record.recording { background: #2ed573; animation: pulse 1.5s infinite; }
    .btn-send { background: #70a1ff; color: white; display: none; }
    .btn-send:disabled { background: #ced6e0; cursor: not-allowed; }
    #previewAudio { width: 100%; margin-top: 12px; display: none; }
    #status { margin-top: 12px; font-size: 13px; color: #ff6b81; font-weight: 500; }

    .divider {
      margin: 24px 0 16px;
      border: none;
      border-top: 2px dashed #ffeaa7;
    }

    .voice-list-header {
      font-size: 16px;
      color: #2f3542;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: left;
    }
    .voice-item {
      background: #f8f9fa;
      border: 1px solid #f1f2f6;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      text-align: left;
    }
    .voice-date {
      font-size: 12px;
      color: #a4b0be;
      margin-bottom: 6px;
    }
    .voice-item audio {
      width: 100%;
      height: 36px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); opacity: 0.8; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>💌 กล่องข้อความเสียง</h2>
    <p>กดปุ่มเพื่ออัดเสียงส่งหากันได้เลย</p>

    <!-- ส่วนอัดเสียง -->
    <button id="recordBtn" class="btn btn-record" onclick="toggleRecord()">🎙️ กดเพื่อเริ่มอัดเสียง</button>
    <audio id="previewAudio" controls></audio>
    <button id="sendBtn" class="btn btn-send" onclick="sendToGoogleDrive()">📤 ส่งข้อความเสียง</button>
    <div id="status"></div>

    <hr class="divider">

    <!-- ส่วนรายการที่เปิดฟังได้ -->
    <div class="voice-list-header">🎧 ข้อความเสียงทั้งหมด</div>
    <div id="voiceList">กำลังโหลดข้อความเสียง...</div>
  </div>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby-yJoX27OnTcsnLs3kjRwGTdp99XAkSWjBYYmgs4svLABULNCQ_X8ni7OR-ffQIGaQ6g/exec";

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let audioBlob = null;

    // ฟังก์ชันอัดเสียง
    async function toggleRecord() {
      const recordBtn = document.getElementById('recordBtn');
      const sendBtn = document.getElementById('sendBtn');
      const previewAudio = document.getElementById('previewAudio');
      const status = document.getElementById('status');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

          mediaRecorder.onstop = () => {
            audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            previewAudio.src = URL.createObjectURL(audioBlob);
            previewAudio.style.display = 'block';
            sendBtn.style.display = 'block';
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.innerText = "⏹️ กำลังอัด... กดเพื่อหยุด";
          recordBtn.classList.add('recording');
          status.innerText = "";
        } catch (err) {
          status.innerText = "⚠️ กรุณากดอนุญาตให้ใช้ไมโครโฟน";
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = "🎙️ อัดใหม่อีกครั้ง";
        recordBtn.classList.remove('recording');
      }
    }

    // ฟังก์ชันส่งไฟล์ไปที่ Drive
    async function sendToGoogleDrive() {
      if (!audioBlob) return;

      const sendBtn = document.getElementById('sendBtn');
      const status = document.getElementById('status');

      sendBtn.disabled = true;
      status.innerText = "⏳ กำลังส่งข้อความเสียง...";

      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];
        const payload = {
          fileName: `voice_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`,
          mimeType: 'audio/webm',
          audioBase64: base64Data
        };

        try {
          await fetch(GAS_WEBAPP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          status.innerText = "✨ ส่งข้อความเรียบร้อยแล้ว!";
          sendBtn.style.display = 'none';
          
          // รอ 2 วินาทีแล้วโหลดรายการเสียงใหม่
          setTimeout(loadVoiceList, 2000);
        } catch (error) {
          status.innerText = "❌ เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะ";
          sendBtn.disabled = false;
        }
      };
    }

    // ฟังก์ชันดึงรายการไฟล์เสียงมาแสดงบนเว็บ
    async function loadVoiceList() {
      const listDiv = document.getElementById('voiceList');
      try {
        const res = await fetch(GAS_WEBAPP_URL);
        const data = await res.json();

        if (data.status === 'success' && data.files.length > 0) {
          listDiv.innerHTML = data.files.map(item => {
            const dateStr = new Date(item.created).toLocaleString('th-TH', {
              dateStyle: 'short',
              timeStyle: 'short'
            });
            return `
              <div class="voice-item">
                <div class="voice-date">📅 ${dateStr}</div>
                <audio controls preload="none" src="${item.audioUrl}"></audio>
              </div>
            `;
          }).join('');
        } else {
          listDiv.innerHTML = '<div style="color: #a4b0be; font-size: 13px;">ยังไม่มีข้อความเสียงเลย 💌</div>';
        }
      } catch (err) {
        listDiv.innerHTML = '<div style="color: #a4b0be; font-size: 13px;">โหลดข้อความไม่สำเร็จ</div>';
      }
    }

    // โหลดข้อความเสียงทันทีที่เปิดหน้าเว็บ
    loadVoiceList();
  </script>
</body>
</html>
